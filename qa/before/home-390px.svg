<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 2200" width="390" height="2200" style="background:#0A0B0A; font-family:'JetBrains Mono', sans-serif;">
  <defs>
    <style>
      .text-title { font-family: 'Oswald', sans-serif; font-weight: bold; fill: #F5F5F5; }
      .text-lime { fill: #A3E635; }
      .text-muted { fill: #6A6E6A; }
      .bug-box { stroke: #FF4444; stroke-width: 2; stroke-dasharray: 4 2; fill: rgba(255, 68, 68, 0.15); }
      .bug-label { fill: #FF6666; font-size: 10px; font-weight: bold; }
    </style>
  </defs>

  <rect x="0" y="0" width="390" height="30" fill="#1F221F"/>
  <text x="10" y="20" fill="#A3E635" font-size="11" font-weight="bold">AUDIT: BEFORE // VIEWPORT: 390px (iPhone 13/14/15)</text>

  <!-- Header -->
  <rect x="0" y="30" width="390" height="60" fill="#0A0B0A" stroke="#1F221F"/>
  <rect x="16" y="42" width="36" height="36" fill="#A3E635" rx="2"/>
  <text x="25" y="66" fill="#0A0B0A" font-size="16" font-weight="900">KC</text>

  <rect x="74" y="46" width="32" height="28" fill="#141614" stroke="#1F221F" rx="2"/>
  <text x="82" y="64" fill="#A3E635" font-size="10">हिं</text>
  <rect x="114" y="46" width="28" height="28" fill="#141614" stroke="#1F221F" rx="2"/>
  <rect x="150" y="46" width="28" height="28" fill="#141614" stroke="#1F221F" rx="2"/>
  <rect x="188" y="44" width="135" height="32" fill="#A3E635" rx="2"/>
  <text x="200" y="64" fill="#0A0B0A" font-size="11" font-weight="bold">BOOK PICKUP</text>
  <rect x="336" y="46" width="36" height="28" fill="#141614" stroke="#FF4444" rx="2"/>
  <rect x="70" y="38" width="308" height="44" class="bug-box"/>
  <text x="70" y="34" class="bug-label">BUG: Action row packed without 3-zone architecture</text>

  <!-- Hero Section -->
  <rect x="0" y="90" width="390" height="320" fill="#0A0B0A"/>
  <text x="20" y="125" class="text-lime" font-size="10">SIH 2026 // PROBLEM STATEMENT SIH26229</text>
  <text x="20" y="172" class="text-title" font-size="46" letter-spacing="-1">FROM KABADI.</text>
  <text x="20" y="214" class="text-title" font-size="46" fill="none" stroke="#F5F5F5" stroke-width="1.5">TO CIRCULAR.</text>
  <text x="20" y="256" class="text-title text-lime" font-size="46">TRACEABLE.</text>
  <rect x="14" y="132" width="362" height="135" class="bug-box"/>
  <text x="20" y="280" class="bug-label">BUG: Unresponsive typography scale causing layout jitter</text>

  <!-- Bottom Bar collision -->
  <rect x="0" y="2080" width="390" height="120" class="bug-box"/>
  <text x="16" y="2070" class="bug-label">BUG: Mobile sticky navigation overlaying CTA bar</text>
</svg>
