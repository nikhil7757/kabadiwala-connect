<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 2200" width="1440" height="2200" style="background:#0A0B0A; font-family:'JetBrains Mono', sans-serif;">
  <defs>
    <style>
      .text-title { font-family: 'Oswald', sans-serif; font-weight: bold; fill: #F5F5F5; }
      .text-lime { fill: #A3E635; }
      .text-muted { fill: #6A6E6A; }
      .bug-box { stroke: #FF4444; stroke-width: 2; stroke-dasharray: 4 2; fill: rgba(255, 68, 68, 0.15); }
      .bug-label { fill: #FF6666; font-size: 14px; font-weight: bold; }
    </style>
  </defs>

  <rect x="0" y="0" width="1440" height="30" fill="#1F221F"/>
  <text x="32" y="20" fill="#A3E635" font-size="14" font-weight="bold">AUDIT: BEFORE // VIEWPORT: 1440px (Large Desktop)</text>

  <!-- Header -->
  <rect x="0" y="30" width="1440" height="72" fill="#0A0B0A" stroke="#1F221F"/>
  <rect x="32" y="46" width="40" height="40" fill="#A3E635" rx="2"/>
  <text x="42" y="73" fill="#0A0B0A" font-size="20" font-weight="900">KC</text>
  <text x="84" y="66" fill="#F5F5F5" font-size="16" font-weight="bold">KABADIWALA CONNECT</text>

  <!-- Hero Section -->
  <rect x="0" y="102" width="1440" height="520" fill="#0A0B0A"/>
  <text x="32" y="180" class="text-lime" font-size="14">SIH 2026 // PROBLEM STATEMENT SIH26229</text>
  <text x="32" y="260" class="text-title" font-size="96">FROM KABADI.</text>
  <text x="32" y="340" class="text-title" font-size="96" fill="none" stroke="#F5F5F5" stroke-width="2">TO CIRCULAR.</text>
  <text x="32" y="420" class="text-title text-lime" font-size="96">TRACEABLE.</text>

  <rect x="32" y="650" width="1376" height="120" class="bug-box"/>
  <text x="48" y="715" class="bug-label">BUG: Unbounded content expansion without 1280px max-width clamp &amp; responsive margin centering</text>
</svg>
