<!doctype html>
<html lang="hi" data-theme="field" data-motion="on">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#141414" />
    <meta name="description" content="Kabadiwala Connect - Bringing the Informal Collector into the Formal Recycling Chain" />
    <link rel="manifest" href="/manifest.json" />
    <title>Kabadiwala Connect</title>
    <script>
      // Automatically refresh stale service worker caches from previous deployments
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var reg of regs) {
            reg.update();
            if (reg.waiting) {
              reg.waiting.postMessage({ type: 'SKIP_WAITING' });
            }
          }
        });
      }
    </script>
  </head>
  <body class="bg-kc-bg text-kc-ink antialiased selection:bg-kc-accent selection:text-kc-ink min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
